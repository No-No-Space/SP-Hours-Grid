name: Release

# Push a tag matching the manifest version, e.g.  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag must match manifest version
        run: |
          v=$(node -p "require('./src/manifest.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $v"; exit 1
          fi

      - run: npm test
      - run: npm run build

      - name: Listing entry for community-plugins.json
        run: |
          {
            echo "Install: Super Productivity → Settings → Plugins → upload \`hours-grid-${GITHUB_REF_NAME#v}.zip\`."
            echo
            echo "Entry for \`src/assets/community-plugins.json\` in super-productivity:"
            echo
            echo '```json'
            npm run --silent listing
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
